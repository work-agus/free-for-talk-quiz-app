<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free For Talk Quiz & Deep Talk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Login / Room Selection -->
    <div id="login-screen" class="glass rounded-2xl p-8 max-w-md w-full shadow-xl transition-all duration-500">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Free For Talk Quiz ✨</h1>
        <p class="text-gray-600 mb-6 text-center">Mulai obrolan seru bersama teman atau pasangan.</p>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Room ID</label>
                <input type="text" id="room-id" placeholder="Contoh: seru123"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-400 focus:outline-none bg-white/50">
            </div>
            <button id="join-btn"
                class="w-full bg-gradient-to-r from-purple-500 to-indigo-500 text-white font-semibold py-3 rounded-lg shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5">
                Masuk Room
            </button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen"
        class="hidden glass rounded-2xl p-8 max-w-lg w-full shadow-2xl transition-all duration-500 relative">
        <div
            class="absolute top-4 right-4 bg-white/80 px-3 py-1 rounded-full text-xs text-purple-600 font-bold shadow-sm">
            Room: <span id="display-room-id"></span>
        </div>

        <h2 class="text-xl font-semibold text-gray-800 mb-6 text-center">Topik Obrolan</h2>

        <div class="flex justify-center flex-wrap gap-2 mb-8">
            <button
                class="topic-btn px-4 py-2 rounded-full bg-white/60 hover:bg-purple-100 text-gray-700 text-sm transition border border-purple-200"
                data-topic="Deep Talk">Deep Talk</button>
            <button
                class="topic-btn px-4 py-2 rounded-full bg-white/60 hover:bg-purple-100 text-gray-700 text-sm transition border border-purple-200"
                data-topic="Fun & Laughs">Fun</button>
            <button
                class="topic-btn px-4 py-2 rounded-full bg-white/60 hover:bg-purple-100 text-gray-700 text-sm transition border border-purple-200"
                data-topic="Future & Dreams">Future</button>
            <button
                class="topic-btn px-4 py-2 rounded-full bg-white/60 hover:bg-purple-100 text-gray-700 text-sm transition border border-purple-200"
                data-topic="Perspective">Perspective</button>
        </div>

        <div id="question-container"
            class="min-h-[150px] flex items-center justify-center text-center mb-8 p-6 bg-white/40 rounded-xl border border-white/60">
            <p id="question-text" class="text-xl text-gray-800 font-medium leading-relaxed">Pilih topik di atas untuk
                memulai!</p>
        </div>

        <div class="flex flex-col gap-3">
            <button id="next-btn"
                class="w-full bg-gray-800 text-white font-semibold py-3 rounded-lg shadow-md hover:bg-gray-900 transition">
                Pertanyaan Selanjutnya 🎲
            </button>
            <button id="done-btn"
                class="w-full bg-white text-gray-700 border border-gray-300 font-semibold py-3 rounded-lg hover:bg-green-50 hover:text-green-600 hover:border-green-300 transition flex items-center justify-center gap-2">
                <span>✅</span> Sudah Dibahas
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
